project:
  namespace: "org.simplemodeling.textus"
  id: "AiRuntime"
  title: "Textus AI Runtime"
  kind: car
  component:
    displayName: "Textus AI Runtime"
    version: "0.2.1-SNAPSHOT"
    config:
      textus.server.default-port: "18002"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.4-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.2-SNAPSHOT"
      - "org.simplemodeling::simplemodeling-model:0.2.0"
    test:
      - "org.scalatest::scalatest:3.2.19"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "platform"
      domain: "ai-runtime"
    runtime:
      cncf:
        minimum: "0.5.2-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.2-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-ai-runtime"
