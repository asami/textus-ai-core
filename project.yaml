project:
  name: "textus-ai-runtime"
  title: "Textus AI Runtime"
  kind: car
  organization: "org.textus"
  scalaPackage: "org.simplemodeling.textus.ai"
  component:
    name: "textus-ai-runtime"
    className: "TextusAi"
    displayName: "Textus AI Runtime"
    version: "0.2.1"
    config:
      textus.server.default-port: "18002"

build:
  scalaVersion: "3.3.8"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.1"
      - "org.simplemodeling::simplemodeling-model:0.2.0"
    test:
      - "org.scalatest::scalatest:3.2.19"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "platform"
      domain: "ai-runtime"
    runtime:
      cncf:
        minimum: "0.5.1"
        excluded: []
        tested:
          - "0.5.1"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-ai-runtime"
